<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Consultório</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container login-container">
    
        <aside class="sidebar">
            <div class="logo">
                <h2>🏩 Consultório legal</h2>
            </div>
            <div class="welcome-text">
                <h1>Bem-vindo</h1>
                <p>aqui somos legais!😁</p>
            </div>
            <div class="sidebar-footer">
              
            </div>
        </aside>

        
        <main class="form-area">
            <header class="form-header">
                <h2>Cadastro</h2>
                <p>Já tem uma conta? <a href="#">Entre aqui</a></p>
            </header>

            <form action="../home_screen/index.html" method="post">
                
                
                <div class="section-title">Dados Pessoais</div>
                <div class="form-grid">
                    <div class="field-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Informe seu nome completo" required>
                    </div>
                    <div class="field-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="Informe os números do seu CPF" required>
                    </div>
                    <div class="field-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Informe o seu e-mail" required>
                    </div>
                    <div class="field-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="******" required>
                    </div>
                </div>

                
                <div class="section-title">Dados Profissionais</div>
                <div class="form-grid">
                    <div class="field-group">
                        <label for="sigla_conselho">Sigla do Conselho</label>
                        <select id="sigla_conselho" required>
                            <option value="" disabled selected>Selecione ou digite a sigla</option>
                            <option value="CRM">CRM</option>
                            <option value="CRO">CRO</option>
                            <option value="COREN">COREN</option>
                            <option value="CREFITO">CREFITO</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label for="uf">UF</label>
                        <select id="uf" required>
                            <option value="" disabled selected>Selecione ou digite o estado</option>
                            <option value="SP">SP</option>
                            <option value="RJ">RJ</option>
                            <option value="MG">MG</option>
                            <option value="RS">RS</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label for="num_conselho">Número do Conselho</label>
                        <input type="text" id="num_conselho" placeholder="Informe o seu número do Conselho" required>
                    </div>

                    <div class="field-group">
                        <label for="especialidade">Especialidade</label>
                        <input type="text" id="especialidade" placeholder="Informe a sua especialidade" required>
                    </div>
                </div>

                
                <div class="button-container">
                    <button type="submit" class="btn-submit">Entrar</button>
                </div>

            </form>
        </main>
    </div>
</body>

</html>
